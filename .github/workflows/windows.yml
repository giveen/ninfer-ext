# Windows compile gate.
#
# This is the only place the tree is compiled by MSVC, and it deliberately runs no tests: GitHub
# hosted runners have no GPU, and the hosted GPU runners are T4 (sm_75), which this engine does not
# target (sm_120a only). Behavior is established by running the packaged build on a Windows machine;
# docs/maintainer/windows-port.md records what that run has to cover and what is still unverified.
name: windows

on:
  push:
    branches: [master, windows/native-serve]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg builds FFmpeg and libcurl from source, which is the long pole of this job. The binary cache
  # makes that a first-run cost instead of a per-run one.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite

jobs:
  build:
    # Visual Studio 2026 18.x, whose toolset is MSVC 195x. The Visual Studio 2022 image cannot build
    # this tree at all -- <flat_map> landed in MSVC 14.51 -- which is why the image is pinned by name
    # rather than used through windows-latest.
    runs-on: windows-2025-vs2026
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space if needed
        shell: pwsh
        run: |
          # The CMake build tree lives on the workspace drive, so what the system drive has to hold is
          # the CUDA install and vcpkg's installed tree. This runner starts with roughly 33 GiB free
          # there and the cleanup below buys about 12 more, at a cost of around 14 minutes, because
          # emptying trees with hundreds of thousands of files is dominated by walking them. So it
          # runs on the measured number rather than on principle.
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free

          if ((Get-PSDrive C).Free -ge 30GB) {
            Write-Host "no cleanup needed"
          } else {
            # The on-access scanner inspects every file as it is deleted, so it is off for this job;
            # robocopy then empties each tree in bulk rather than one path at a time. Nothing removed
            # here is used by the build.
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            $empty = Join-Path $env:RUNNER_TEMP 'empty'
            New-Item -ItemType Directory -Force -Path $empty | Out-Null
            $unused = @(
              'C:\Android',
              'C:\Program Files (x86)\Android',
              'C:\Program Files\dotnet'
            )
            foreach ($path in $unused) {
              if (-not (Test-Path $path)) { continue }
              $start = (Get-PSDrive C).Free
              robocopy $empty $path /MIR /NFL /NDL /NJH /NJS /NP | Out-Null
              # robocopy reports 0-7 for success - 1 means it copied (that is, deleted) files, which
              # is the point - and 8 or above for a real failure.
              if ($LASTEXITCODE -ge 8) { throw "robocopy could not empty $path" }
              Remove-Item -Recurse -Force $path -ErrorAction SilentlyContinue
              Write-Host ("freed {0:N1} GiB from {1}" -f (((Get-PSDrive C).Free - $start) / 1GB), $path)
            }
          }

          # The harness ends the step with `exit $LASTEXITCODE`, and every robocopy success code is
          # non-zero, so it is cleared rather than leaking out as a step failure.
          $LASTEXITCODE = 0
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free

      # The image ships the Visual Studio toolset but does not put cl.exe, link.exe or Ninja on the
      # path of a plain step.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 13.3
        uses: Jimver/cuda-toolkit@v0.2.36
        # The full local installer took 19 minutes on one run and over 40 on another, so this bounds
        # it: a stuck installer should fail the job in half an hour, not hold the only runner slot.
        timeout-minutes: 30
        with:
          cuda: '13.3.0'
          method: 'local'

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          # Two things the first successful run taught us, both of which fail configure outright:
          #  * msvc-dev-cmd exports the Visual Studio-bundled vcpkg in VCPKG_ROOT, which disagrees with
          #    the toolchain file below. One root, so the toolchain, the cache and any direct vcpkg
          #    invocation agree.
          #  * vcpkg refuses a binary-cache directory that does not exist, and actions/cache does not
          #    create one, so the very first run failed before building anything.
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          Write-Host "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Report the toolchain, and prove it compiles the standard library this tree needs
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version
          nvcc --version | Select-Object -Last 2

          # <flat_map> is why the image is pinned to the Visual Studio 2026 label: CMake maps
          # CMAKE_CXX_STANDARD 23 to /std:c++latest, and the artifact schema includes <flat_map>.
          @'
          #include <flat_map>
          #include <print>
          int main() {
              std::flat_map<int, int> map;
              map[1] = 2;
              std::println("flat_map and print work: {}", map[1]);
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP\standard_probe.cpp"
          cl /nologo /std:c++latest /EHsc /Fe:"$env:RUNNER_TEMP\standard_probe.exe" "$env:RUNNER_TEMP\standard_probe.cpp"
          if ($LASTEXITCODE -ne 0) { throw "the toolset cannot compile <flat_map>" }
          & "$env:RUNNER_TEMP\standard_probe.exe"

      - name: Configure
        shell: pwsh
        run: |
          # Module scanning is off for the same reason the Linux build turns it off: the tree uses no
          # modules, and the scan is a C++23-only cost that has bitten this build before.
          # NINFER_BUILD_APPS covers the CLI and server, the two targets this branch ships.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF `
            -DNINFER_BUILD_APPS=ON `
            -DBUILD_TESTING=OFF `
            -DNINFER_BUILD_BENCHMARKS=OFF
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        shell: pwsh
        run: |
          # -k 0 keeps ninja going after a failed translation unit: the first MSVC compile of this tree
          # is expected to produce several independent errors, and one run should report all of them
          # rather than the first. The step still fails, because ninja reports failure for the run.
          cmake --build build --target ninfer ninfer-serve ninfer-probe --parallel -- -k 0
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Stage a runnable package
        shell: pwsh
        run: |
          # Everything the two executables load has to travel with them: the CUDA runtime, and the
          # DLLs vcpkg built (FFmpeg, libcurl and their own dependencies). Copying the whole
          # installed bin directory is deliberate -- resolving the transitive set by hand is exactly
          # the kind of omission that only shows up on a tester's machine.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/apps/ninfer.exe, build/apps/ninfer-serve.exe, build/apps/ninfer-probe.exe dist/
          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" dist/ -ErrorAction SilentlyContinue
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist/ -ErrorAction SilentlyContinue
          Copy-Item README.md, docs/serving.md dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-x64
          path: dist/**
          if-no-files-found: error
